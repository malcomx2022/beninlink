# Prouve qu'un mauvais mot de passe est refusé : l'erreur du serveur s'affiche et
# l'app reste sur l'écran de connexion, sans ouvrir le tableau de bord.
appId: app.beninlink.marchand
tags:
  - lecture
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 20000
- tapOn:
    id: "login-identifiant"
- inputText: "${MAESTRO_IDENTIFIANT}"
- tapOn:
    id: "login-mot-de-passe"
- inputText: "mauvais-mot-de-passe-maestro"
- hideKeyboard
- tapOn: "Se connecter"
- extendedWaitUntil:
    visible:
      id: "login-erreur"
    timeout: 30000
- assertVisible: "Se connecter"
- assertVisible: "Identifiant marchand"
- assertNotVisible: "Tableau de bord"
