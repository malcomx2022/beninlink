# /etc/nginx/sites-available/beninlink.conf
# Multi-tenant : apex + tous les sous-domaines -> même app Laravel (web/public)
#
# Marche à suivre complète — et l'ordre à respecter — dans nginx/README.md :
# ce fichier référence un certificat qui doit exister AVANT que nginx démarre.

server {
    listen 80; listen [::]:80;
    server_name beninlink.app *.beninlink.app;

    # Le renvoi laisse passer /.well-known/ : sans cette exception, un
    # renouvellement par défi HTTP-01 échouerait sur une redirection 301.
    location /.well-known/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` est déprécié depuis nginx 1.25.1 au profit de
    # `http2 on;` — mais cette directive n'existe PAS avant, et Ubuntu 22.04
    # sert nginx 1.18. La forme ci-dessous marche partout, au prix d'un
    # avertissement au démarrage sur les versions récentes. Portable d'abord.
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name beninlink.app *.beninlink.app;
    root /var/www/beninlink/web/public;   # NB : web/ (monorepo)
    index index.php;

    # Certificat GÉNÉRIQUE (*.beninlink.app) : il ne s'obtient que par défi
    # DNS-01. Voir README.md — `certbot --nginx` ne sait pas le délivrer.
    ssl_certificate     /etc/letsencrypt/live/beninlink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beninlink.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 25 Mo : s'accorde avec `upload_max_filesize` de php/beninlink.ini. Les
    # deux doivent bouger ensemble, sinon la plus basse décide en silence.
    client_max_body_size 25M;

    # En-têtes de sécurité. `always` les envoie aussi sur les réponses d'erreur,
    # là où une page d'erreur non protégée serait justement exploitable.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS : un ENGAGEMENT, pas un réglage. Une fois reçu, le navigateur refuse
    # tout HTTP sur le domaine ET ses sous-domaines pendant `max-age`. C'est ce
    # qu'on veut ici — chaque société est un sous-domaine servi en HTTPS — mais
    # on commence court (5 min) et on passe à un an une fois la chaîne vérifiée.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        # Le snippet Debian contient `try_files $fastcgi_script_name =404;`,
        # qui ferme la faille classique de PATH_INFO : sans lui, une URL comme
        # /image.png/x.php ferait exécuter un fichier téléversé.
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # ⚠️ SANS CETTE LIGNE, LARAVEL CROIT SERVIR EN HTTP.
        # En fastcgi, PHP ne voit pas le TLS : nginx le termine, et rien ne le
        # dit à PHP-FPM. `$_SERVER['HTTPS']` reste donc vide, et c'est la SEULE
        # chose que Symfony regarde ici — `TrustProxies` ne sert à rien, il n'y
        # a pas de proxy HTTP devant, et `$proxies` vaut `null` de toute façon.
        # Conséquence, vérifiée en construisant la requête telle que FPM la
        # reçoit : `url()` et `route()` rendent des URL en **http://**. Donc le
        # lien de réinitialisation de mot de passe envoyé par courriel, et
        # surtout le `callback_url` remis à FedaPay — l'URL sur laquelle le
        # client revient après avoir payé.
        fastcgi_param HTTPS on;

        # 120 s : s'accorde avec `max_execution_time` de php/beninlink.ini.
        # Le défaut d'nginx est 60 s, et l'import Excel des colis est
        # SYNCHRONE (`ParcelImport` n'implémente pas `ShouldQueue`), tout comme
        # la génération des relevés PDF. À 60 s, nginx rend un 504 pendant que
        # PHP continue d'écrire en base : le marchand voit une erreur, et son
        # import est passé quand même.
        fastcgi_read_timeout 120s;
    }

    # Tout fichier caché est refusé, SAUF /.well-known (ACME, découverte).
    location ~ /\.(?!well-known).* { deny all; }
}
