; /etc/php/8.3/fpm/conf.d/99-beninlink.ini
;
; Surcouche PHP-FPM pour BeninLink. Additive : elle ne remplace pas le php.ini
; de la distribution, elle passe après lui. Copier aussi dans
; /etc/php/8.3/cli/conf.d/99-beninlink.ini — `deploy.sh`, le worker et les
; commandes artisan passent par le CLI, pas par FPM.

; --- Taille des envois -------------------------------------------------------
; Nginx accepte 25 Mo (client_max_body_size, voir nginx/beninlink.conf). PHP
; par défaut s'arrête à 2 Mo : l'import Excel d'un marchand échouerait bien
; avant la limite annoncée, et le message serait celui de PHP, pas le nôtre.
; post_max_size reste au-dessus de upload_max_filesize, sinon la seconde n'a
; aucun effet ; c'est nginx qui refuse en premier, avec un message clair.
upload_max_filesize = 25M
post_max_size = 26M
max_file_uploads = 20

; --- Mémoire et durée --------------------------------------------------------
; L'import de colis (maatwebsite/excel) et la génération des relevés PDF
; (dompdf) sont les deux chemins coûteux. 512M laisse de la marge sans
; masquer une fuite : au-delà, c'est un défaut, pas un manque de mémoire.
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

; --- Fuseau ------------------------------------------------------------------
; Laravel impose APP_TIMEZONE à son propre runtime, mais les bibliothèques qui
; appellent date() sans passer par Carbon lisent celui-ci.
date.timezone = Africa/Porto-Novo

; --- OPcache -----------------------------------------------------------------
; validate_timestamps RESTE À 1, volontairement. Le mettre à 0 gagne quelques
; pour-cent, au prix d'un `systemctl reload php8.3-fpm` obligatoire à chaque
; déploiement — que `deploy.sh` ne fait pas, et qui demanderait un droit sudo
; à l'utilisateur `deploy`. Une optimisation qui casse en silence dès qu'on
; oublie une étape n'est pas une optimisation.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- Discrétion --------------------------------------------------------------
; La trace d'erreur part dans storage/logs (APP_DEBUG=false), jamais au
; visiteur : une erreur PHP affichée sur une page de paiement montre des
; chemins, des versions, parfois une requête SQL.
expose_php = Off
display_errors = Off
log_errors = On
