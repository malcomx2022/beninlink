; /etc/supervisor/conf.d/beninlink-worker.conf
;
; Worker de la file des envois (D13) : SMS, notifications poussées, e-mails.
; Sans lui, ces envois s'accumulent dans la table `jobs` sans jamais partir —
; l'application, elle, continue de répondre normalement. Surveiller avec
; `php artisan beninlink:file-attente` (voir scheduler-cron.txt).
;
; Pas de connexion nommée dans la commande : le worker suit `QUEUE_CONNECTION`
; du .env (`database`). L'ancienne version visait `redis`, que l'application
; n'utilise pas — le worker n'aurait rien traité.
;
; `--max-time=3600` recycle le processus toutes les heures (fuite mémoire de
; PHP en longue durée) ; `queue:restart` du déploiement le fait repartir avec
; le nouveau code.
[program:beninlink-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/beninlink/web/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=3600
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/beninlink/web/storage/logs/worker.log
