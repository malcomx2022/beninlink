name: Déploiement BeninLink (VPS Infomaniak)

# Un push sur `main` déploie en production. Le déclenchement manuel sert à
# rejouer un déploiement sans avoir à pousser un commit.
#
# Les pull requests déclenchent la suite de tests **sans** déployer : sans cela,
# une correction de l'intégration elle-même ne pourrait se vérifier qu'après
# fusion — c'est-à-dire en poussant à l'aveugle sur `main`.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# La sérialisation des déploiements est posée SUR LES JOBS de déploiement
# (`deploy`, `deploy-recette`), pas sur le workflow : posée ici, elle retenait
# aussi la suite de tests d'une pull request derrière le déploiement de `main`
# en cours — huit à quinze minutes d'attente par lot, pour rien (S100).
jobs:
  tests:
    name: Suite de tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PHP 8.3 — la version que le VPS doit servir. Elle est écrite à trois
      # endroits qui doivent rester d'accord : ici, `config.platform.php` dans
      # `web/composer.json` (ce que composer résout), et le garde en tête de
      # `deploy.sh` (ce que le serveur exécute réellement).
      #
      # Le plafond précédent était 8.2, tenu par `lcobucci/clock 2.3.0` — tiré
      # par `lcobucci/jwt`, lui-même tiré par le seul `vonage/client`. Monter
      # le SDK Vonage a levé le plafond ; `lcobucci/clock` a disparu du lock.
      #
      # Pas de `--ignore-platform-reqs` : l'intégration doit tester ce que le
      # projet peut **vraiment** installer.
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, json, mbstring, mysqli, pdo, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Dépendances
        working-directory: web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Clé d'application
        working-directory: web
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # La suite tourne sur SQLite en mémoire (`phpunit.xml`) : aucun service
      # externe à démarrer, et c'est ce qui rend cette étape tenable.
      - name: php artisan test
        working-directory: web
        run: php artisan test

  # S84 (M2) — les deux apps Expo : typage, lint et tests, sur une pull request
  # comme sur `main`. Elles ne partent PAS par ce workflow (EAS les compile), donc
  # ce job ne conditionne pas `deploy` : une app rouge ne retient pas un correctif
  # serveur. Il rend simplement sa couleur visible sur la pull request — jusqu'ici
  # seul `php artisan test` tournait, et ni `tsc` ni `expo lint` n'étaient exécutés
  # ailleurs que sur la machine de celui qui commettait.
  #
  # Les tests d'app (`jest-expo`) exécutent les modules purs (montants FCFA,
  # statuts, niveaux douaniers, pagination) et rendent la carte des alertes
  # douanières. Le CONTRAT avec le backend (tailles de page, valeurs des enums)
  # reste tenu côté PHP par `MerchantAppCustomsContractTest` et consorts : un test
  # d'app ne peut pas lire `web/`.
  apps:
    name: Apps Expo (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, mobile-livreur]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      # `npm ci` : le lock fait foi, comme `composer install` côté PHP.
      - name: Dépendances
        run: npm ci

      - name: Typage
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Tests
        run: npm test -- --ci

  # S80 — la RÉPÉTITION de déploiement : ce que `deploy.sh` fait sur le serveur,
  # rejoué ici avant, sur une pull request comme sur `main`.
  #
  # La suite de tests tourne AVEC les dépendances de dev et sur SQLite en mémoire ;
  # `deploy.sh` installe `--no-dev` et parle à MySQL. Entre les deux, tout ce qui
  # ne se voit qu'en production : un paquet de dev enregistré sans condition
  # (S79 — `package:discover` tombait pendant `composer install`), une semence
  # qui lit un paquet absent, une route à fermeture que `route:cache` refuse, une
  # vue que `view:cache` ne compile pas, une société sans zones que
  # `beninlink:tarification-prete` refuse. Ce job les voit sur la pull request.
  #
  # Les commandes artisan rejouées sont CELLES de `deploy.sh`, dans son ordre
  # (`php artisan down` / `up`, qui pilotent le site vivant, exceptées) :
  # `DeploymentRehearsalTest` lit le script et ce fichier, et refuse qu'une étape
  # ajoutée au déploiement ne soit pas répétée ici.
  repetition:
    name: Répétition de déploiement
    needs: tests
    runs-on: ubuntu-latest
    services:
      # La vraie base, pas une approximation : les semences du socle insèrent du
      # SQL MySQL (`CurrencySeeder` échappe une apostrophe à la façon MySQL, que
      # SQLite refuse — constaté en S79).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: beninlink
          MYSQL_ROOT_PASSWORD: repetition
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prepetition"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, json, mbstring, mysqli, pdo, pdo_mysql, bcmath, intl, zip
          coverage: none

      # `--no-dev`, comme deploy.sh : c'est tout l'objet de ce job. Le script
      # `package:discover` de composer tourne ici, sans les paquets de dev.
      - name: Dépendances de production (--no-dev)
        working-directory: web
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # Un `.env` de recette : APP_ENV=staging (le jeu pilote est refusé en
      # production), FedaPay en sandbox, une API_KEY propre — ce que
      # `verifier-env.sh` exige avant de laisser deploy.sh couper le site.
      - name: .env de recette, vérifié par le garde de deploy.sh
        working-directory: web
        run: |
          cp .env.example .env
          php artisan key:generate --force
          poser() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
          poser APP_ENV staging
          poser APP_DEBUG false
          poser APP_INSTALLED yes
          poser API_KEY blk_repetition_ci
          poser DB_CONNECTION mysql
          poser DB_HOST 127.0.0.1
          poser DB_PORT 3306
          poser DB_DATABASE beninlink
          poser DB_USERNAME root
          poser DB_PASSWORD repetition
          poser QUEUE_CONNECTION sync
          poser MAIL_MAILER log
          poser FEDAPAY_ENVIRONMENT sandbox
          bash ../docs/guides/infra/deploy/verifier-env.sh .env

      # L'installation d'une recette, telle que le guide la décrit (§1) : base,
      # semences du socle, jeu pilote. Depuis S86 les semences posent le cadre
      # de zones de CHAQUE société qu'elles créent : aucun contournement ici,
      # sinon le job cacherait une régression du seeder que
      # `beninlink:tarification-prete` doit mesurer (DeploymentRehearsalTest).
      - name: Base de recette (migrate, db:seed, jeu pilote)
        working-directory: web
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan beninlink:pilote

      # Les commandes de deploy.sh, dans son ordre.
      - name: Les commandes de deploy.sh, dans l'ordre
        working-directory: web
        run: |
          php artisan optimize:clear
          php artisan beninlink:comptes-amorcage
          php artisan beninlink:tarification-prete
          php artisan migrate --force
          php artisan config:cache && php artisan route:cache && php artisan view:cache
          php artisan queue:restart

      # Et l'application répond, caches en place, sans les dépendances de dev :
      # la porte de l'API (S77) avec la clé du .env, puis sans — 200 puis 400.
      - name: L'application répond
        working-directory: web
        run: |
          php artisan route:list --path=api/v10 > /dev/null
          php artisan serve --host=127.0.0.1 --port=8099 > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          reponse=$(curl -s -H 'apiKey: blk_repetition_ci' http://127.0.0.1:8099/api/v10/general-settings)
          echo "$reponse" | head -c 300; echo
          echo "$reponse" | grep -q '"success":true' || { echo "::error::L'API ne répond pas avec la clé du .env"; cat serve.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/v10/general-settings)
          [ "$code" = "400" ] || { echo "::error::Sans clé d'API, attendu 400, reçu $code"; exit 1; }

  deploy:
    name: Déploiement sur le VPS
    # Rien ne part en production sans que la suite soit passée. Le dépôt n'a
    # jamais eu de garde automatique : c'est ici qu'il en gagne un. Depuis S80,
    # la répétition de déploiement doit passer aussi.
    needs: [tests, repetition]
    # Une pull request exerce les tests, jamais le déploiement.
    if: github.event_name != 'pull_request'
    # Deux déploiements simultanés couperaient et remonteraient le site en
    # parallèle, avec deux `artisan migrate` concurrents sur la même base. On
    # les sérialise, et on n'annule pas celui qui tourne : l'interrompre entre
    # `down` et `up` laisserait le site en maintenance. (S100 : au niveau du job.)
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Les secrets sont-ils en place ?
        env:
          HOTE: ${{ secrets.SSH_HOST }}
          UTILISATEUR: ${{ secrets.SSH_USER }}
          CLE: ${{ secrets.SSH_KEY }}
        run: |
          manquants=""
          [ -n "$HOTE" ] || manquants="$manquants SSH_HOST"
          [ -n "$UTILISATEUR" ] || manquants="$manquants SSH_USER"
          [ -n "$CLE" ] || manquants="$manquants SSH_KEY"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets de dépôt manquants :$manquants — à renseigner dans Settings → Secrets and variables → Actions. (SSH_PORT est facultatif, 22 par défaut.)"
            exit 1
          fi

      - name: Déploiement par SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: /var/www/beninlink
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Les scripts de déploiement sont pris à la version qu'on déploie, et
            # non à celle laissée par le déploiement précédent : sans cela, une
            # correction du script ne s'appliquerait qu'au déploiement suivant
            # — c'est-à-dire jamais à celui qui la transporte. Le dossier entier :
            # deploy.sh appelle verifier-env.sh (S76).
            git fetch origin main
            git checkout FETCH_HEAD -- docs/guides/infra/deploy/
            DEPLOY_PATH="$DEPLOY_PATH" bash docs/guides/infra/deploy/deploy.sh

  # S76 (E2) — le serveur de RECETTE : un vhost sur la même machine que la
  # production (`/var/www/beninlink-recette`, utilisateur système, base et `.env`
  # propres), déployé depuis `main` lui aussi — la recette éprouve exactement ce
  # qui part en production, pas une autre branche.
  #
  # Ses secrets sont les siens (`RECETTE_SSH_*`). Tant qu'ils sont vides, le job
  # se SAUTE au lieu d'échouer : la production ne dépend pas de la recette.
  # Sur le serveur, `deploy.sh` refuse un `.env` de recette qui porterait des
  # clés FedaPay live, et tout `.env` sans API_KEY (`verifier-env.sh`, S76 / S77).
  deploy-recette:
    name: Déploiement sur le serveur de recette
    needs: [tests, repetition]
    if: github.event_name != 'pull_request'
    # Même règle que `deploy`, sur son propre serveur : un autre groupe (S100).
    concurrency:
      group: deploiement-recette
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Le serveur de recette est-il configuré ?
        id: config
        env:
          HOTE: ${{ secrets.RECETTE_SSH_HOST }}
          UTILISATEUR: ${{ secrets.RECETTE_SSH_USER }}
          CLE: ${{ secrets.RECETTE_SSH_KEY }}
        run: |
          if [ -n "$HOTE" ] && [ -n "$UTILISATEUR" ] && [ -n "$CLE" ]; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
          else
            echo "actif=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de serveur de recette configuré (secrets RECETTE_SSH_HOST / RECETTE_SSH_USER / RECETTE_SSH_KEY) : étape sautée."
          fi

      - name: Déploiement par SSH (recette)
        if: steps.config.outputs.actif == 'true'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.RECETTE_DEPLOY_PATH || '/var/www/beninlink-recette' }}
        with:
          host: ${{ secrets.RECETTE_SSH_HOST }}
          username: ${{ secrets.RECETTE_SSH_USER }}
          key: ${{ secrets.RECETTE_SSH_KEY }}
          port: ${{ secrets.RECETTE_SSH_PORT || secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout FETCH_HEAD -- docs/guides/infra/deploy/
            DEPLOY_PATH="$DEPLOY_PATH" bash docs/guides/infra/deploy/deploy.sh
